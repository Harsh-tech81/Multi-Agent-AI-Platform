name : agentflow deploy 

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

jobs:
  deploy-backend:
     runs-on: ubuntu-latest
     steps:
        - name: Checkout code
          uses: actions/checkout@v4
  
        - name: aws configure
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Login to ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build Gateway
          run: |
            docker build \
            -f backend/gateway/Dockerfile \
            -t gateway backend

        - name: tag Gateway
          run: |
            docker tag gateway:latest \
            $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest
           
        - name: Push Gateway
          run: |
            docker push $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest



        - name: Build Auth Service
          run: |
            docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service backend

        - name: tag Auth Service
          run: |
            docker tag auth-service:latest \
            $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest
           
        - name: Push Auth Service
          run: |
            docker push $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest


        - name: Build Chat Service
          run: |
            docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service backend

        - name: tag Chat Service
          run: |
            docker tag chat-service:latest \
            $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest
           
        - name: Push Chat Service
          run: |
            docker push $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest


        - name: Build Billing Service
          run: |
            docker build \
            -f backend/services/billing/Dockerfile \
            -t billing-service backend

        - name: tag Billing Service
          run: |
            docker tag billing-service:latest \
            $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest
           
        - name: Push Billing Service
          run: |
            docker push $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest


        - name: Build Agent Service
          run: |
            docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service backend

        - name: tag Agent Service
          run: |
            docker tag agent-service:latest \
            $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest
           
        - name: Push Agent Service
          run: |
            docker push $AWS_ACCESS_KEY_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest


        - name: deploy gateway
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.GATEWAY_SERVICE }} \
            --force-new-deployment


        - name: deploy auth
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AUTH_SERVICE }} \
            --force-new-deployment  


        - name: deploy chat
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.CHAT_SERVICE }} \
            --force-new-deployment 


        - name: deploy billing
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.BILLING_SERVICE }} \
            --force-new-deployment 

        - name: deploy agent
          run: |
            aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AGENT_SERVICE }} \
            --force-new-deployment 

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

      - name : Upload Frontend to S3
        run: |
         aws s3 sync \
          frontend/dist \
          s3://${{ secrets.S3_BUCKET_NAME }} \
          -- delete \
          

      - name : Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"



   

      