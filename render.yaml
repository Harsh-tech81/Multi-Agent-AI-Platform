services:
  # 1. API Gateway (Public Web Service)
  - type: web
    name: cortex-gateway
    env: node
    plan: free
    rootDir: backend/gateway
    buildCommand: npm install && cd .. && npm install
    startCommand: npm start
    envVars:
      - key: FRONTEND_URL
        sync: false 
      - key: AUTH_SERVICE_URL
        value: https://cortex-auth.onrender.com
      - key: CHAT_SERVICE_URL
        value: https://cortex-chat.onrender.com
      - key: BILLING_SERVICE_URL
        value: https://cortex-billing.onrender.com
      - key: AGENT_SERVICE_URL
        value: https://cortex-agent.onrender.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: cortex-redis
          property: connectionString

  # 2. Auth Service
  - type: web
    name: cortex-auth
    env: node
    plan: free
    rootDir: backend/services/auth
    buildCommand: npm install && cd ../.. && npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10001"
      - key: MONGO_URI
        sync: false 
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false 
      - key: REDIS_URL
        fromService:
          type: redis
          name: cortex-redis
          property: connectionString

  # 3. Chat Service
  - type: web
    name: cortex-chat
    env: node
    plan: free
    rootDir: backend/services/chat
    buildCommand: npm install && cd ../.. && npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10002"
      - key: REDIS_URL
        fromService:
          type: redis
          name: cortex-redis
          property: connectionString

  # 4. Billing Service
  - type: web
    name: cortex-billing
    env: node
    plan: free
    rootDir: backend/services/billing
    buildCommand: npm install && cd ../.. && npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10003"
      - key: REDIS_URL
        fromService:
          type: redis
          name: cortex-redis
          property: connectionString

  # 5. Agent Service
  - type: web
    name: cortex-agent
    env: node
    plan: free
    rootDir: backend/services/agent
    buildCommand: npm install && cd ../.. && npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10004"
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cortex-redis
          property: connectionString

  # 6. Redis Instance
  - type: redis
    name: cortex-redis
    plan: free 
    ipAllowList: []
